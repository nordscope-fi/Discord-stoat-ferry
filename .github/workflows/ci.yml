name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra native

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Pull Docker Hub images through Google's mirror
        # The feedback container test builds from a Docker Hub base image, and all
        # three Linux jobs pull it at once. Anonymous pulls from shared runner
        # addresses hit Docker Hub's 429 rate limit (PR #1122 failed three times).
        # mirror.gcr.io serves the same digest-pinned image without a login. The
        # existing daemon settings are kept, and the last line fails the job if
        # the mirror did not take effect.
        if: runner.os == 'Linux'
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$config"
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -F mirror.gcr.io

      - name: Tests
        # Exclude the DCE contract test from the version matrix: it downloads the
        # real DCE binary from GitHub's unauthenticated API, so running it across
        # 3 Python versions concurrently trips the API rate limit (intermittent
        # 403 flake). The dedicated cached `contract-test` job below is its sole
        # owner; the matrix only needs the pure-Python suite.
        run: uv run pytest -n 4 --dist=load --ignore=tests/test_dce_contract.py --durations=20

  contract-test:
    name: Contract test (DCE binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache DCE binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.discord-ferry/bin/dce/2.48
          key: dce-${{ runner.os }}-2.48

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra native

      - name: Run contract + replay tests
        run: uv run pytest tests/test_dce_contract.py tests/test_dce_output_replay.py -v


  gates:
    name: Instruction-layer gates
    runs-on: ubuntu-latest
    # A SEPARATE job, deliberately not a step inside lint-and-test: that job runs a
    # three-version Python matrix, so a step there would run the sweep three times
    # per pull request and make three gh calls for one answer.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The sweep resolves origin/main. The default shallow clone makes that
          # ref unresolvable and the script exits 2, which blocks rather than
          # silently passing.
          fetch-depth: 0

      - name: Deferral red-flag sweep
        env:
          # gh is preinstalled on ubuntu-latest but does NOT authenticate on its
          # own. Without this the sweep takes its announced degradation path on
          # every run, skipping the pull request body: the one source that matters,
          # since 0 of 60 Ferry commits carry deferral language while 5 of 110
          # merged pull request bodies do.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-deferrals.sh "origin/${{ github.base_ref || 'main' }}"

      - name: Agent config template check
        # --ci mode checks only tracked files (templates, hook parity structure).
        # It does not read ~/.claude/ or the gitignored generated layer, so it runs
        # on a fresh runner. Catches template drift, missing template files, and
        # parity ledger structural issues.
        run: ./scripts/agent-check.sh --ci
