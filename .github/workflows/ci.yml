name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra native

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Tests
        # Exclude the DCE contract test from the version matrix: it downloads the
        # real DCE binary from GitHub's unauthenticated API, so running it across
        # 3 Python versions concurrently trips the API rate limit (intermittent
        # 403 flake). The dedicated cached `contract-test` job below is its sole
        # owner; the matrix only needs the pure-Python suite.
        run: uv run pytest --ignore=tests/test_dce_contract.py

  contract-test:
    name: Contract test (DCE binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache DCE binary
        uses: actions/cache@v5
        with:
          path: ~/.discord-ferry/bin/dce/2.48
          key: dce-${{ runner.os }}-2.48

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra native

      - name: Run contract + replay tests
        run: uv run pytest tests/test_dce_contract.py tests/test_dce_output_replay.py -v


  windows-atomic-write:
    name: Atomic writes on Windows
    # The rest of CI is ubuntu-only, so nothing here has ever executed on Win32.
    # Issue #172 was an os.rename that refuses an existing destination there and
    # replaces it everywhere else, which no Linux runner can see. It reached a
    # user instead of a test.
    #
    # Two named files rather than the whole suite: #174 tracks the full leg and
    # is blocked on triaging an unknown number of unrelated first-run failures.
    # Naming two files sidesteps that blocker and covers what this code touches.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra native

      - name: Run the atomic-write suites
        # test_atomicio and test_blueprint joined the list in v2.14.6. Every
        # document write now goes through one helper, and the blueprint is the
        # case that matters most, since import_blueprint reads that file back.
        # The conftest fixture only simulates Win32 rename semantics; this is the
        # real thing.
        run: >-
          uv run pytest tests/test_atomicio.py tests/test_state.py
          tests/test_metadata.py tests/test_blueprint.py -v

  gates:
    name: Instruction-layer gates
    runs-on: ubuntu-latest
    # A SEPARATE job, deliberately not a step inside lint-and-test: that job runs a
    # three-version Python matrix, so a step there would run the sweep three times
    # per pull request and make three gh calls for one answer.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The sweep resolves origin/main. The default shallow clone makes that
          # ref unresolvable and the script exits 2, which blocks rather than
          # silently passing.
          fetch-depth: 0

      - name: Deferral red-flag sweep
        env:
          # gh is preinstalled on ubuntu-latest but does NOT authenticate on its
          # own. Without this the sweep takes its announced degradation path on
          # every run, skipping the pull request body: the one source that matters,
          # since 0 of 60 Ferry commits carry deferral language while 5 of 110
          # merged pull request bodies do.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-deferrals.sh "origin/${{ github.base_ref || 'main' }}"

      - name: Agent config template check
        # --ci mode checks only tracked files (templates, hook parity structure).
        # It does not read ~/.claude/ or the gitignored generated layer, so it runs
        # on a fresh runner. Catches template drift, missing template files, and
        # parity ledger structural issues.
        run: ./scripts/agent-check.sh --ci
