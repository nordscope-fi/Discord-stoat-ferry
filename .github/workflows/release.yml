name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Exercise the packaging path on PRs that touch it. workflow_dispatch alone could
  # never do this: GitHub only offers it from the default branch's copy of a workflow,
  # and auto-tag.yml pushes the tag the instant a version bump lands on main -- so
  # there is no window between "dispatch available" and "tag created". A packaging
  # failure found on a tag means deleting and re-cutting a published release.
  # The release job is tag-gated, so these runs build and verify only.
  pull_request:
    paths:
      - "ferry.spec"
      - ".github/workflows/release.yml"
      - "src/discord_ferry/core/http.py"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    # Only a non-secret boolean is hoisted to job level. A step cannot read its
    # own step-level `env` from its own `if:`, so the guard has to resolve above
    # the step — but the certificate itself stays scoped to the signing step so
    # checkout/build steps never see it.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra native --extra dev

      - name: Build executable
        run: uv run --extra dev pyinstaller ferry.spec

      # Launch what we just built. Nothing else in CI ever executes the frozen
      # binary -- ci.yml is ubuntu-only and runs the source tree, so a defect that
      # exists only in the packaged Windows app ships unseen. That is exactly what
      # happened with issue #123: a fault that killed the export on every platform
      # survived eleven releases because no test ran the real thing.
      #
      # Scope: this proves the exe boots, serves, and writes its log. It cannot
      # reproduce a missing WebView2 runtime (the runner has Edge installed), so
      # the blank-window symptom of #123 is out of reach here by design.
      - name: Smoke-test the built binary
        shell: pwsh
        run: |
          $exe = "dist/Ferry.exe"
          $log = Join-Path $env:USERPROFILE ".discord-ferry\logs\ferry.log"
          Remove-Item $log -ErrorAction SilentlyContinue

          $proc = Start-Process $exe -PassThru
          Write-Host "launched pid $($proc.Id)"

          # Onefile unpacks ~46 MB to a temp dir before Python even starts, so be
          # generous: a slow runner is not a failure.
          $served = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/" -TimeoutSec 3 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $served = $true; Write-Host "served after ~$($i*2)s"; break }
            } catch { }
          }

          # Kill the whole tree: native mode runs the pywebview window in a child.
          taskkill /T /F /PID $proc.Id 2>&1 | Out-Null

          if (-not $served) {
            Write-Host "::error::Ferry.exe never served on 127.0.0.1:8765"
            if ($proc.HasExited) { Write-Host "process exited early, code $($proc.ExitCode)" }
            if (Test-Path $log) { Write-Host "--- ferry.log ---"; Get-Content $log }
            exit 1
          }

          # The log is the diagnostic added in v2.11.1. If it is missing here, the
          # frozen build cannot report its own failures -- the condition that made
          # #123 undiagnosable.
          if (-not (Test-Path $log)) {
            Write-Host "::error::no ferry.log written to $log"
            exit 1
          }
          Write-Host "smoke test passed: served on :8765, log at $log"

          # --- CLI dispatch (issue #123 symptom 3) ---
          # System.Diagnostics.Process, NOT Start-Process: this needs captured
          # stdout AND a bounded wait. Redirected stdout is also what satisfies
          # step 1 of the console ladder. Without it the GUI fallback fires and
          # this check proves nothing.
          function Invoke-Ferry([string[]]$FerryArgs, [int]$TimeoutMs = 30000) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path $exe).Path
            $psi.Arguments = $FerryArgs -join ' '
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($psi)
            # Start BOTH reads before waiting, and read them asynchronously.
            # Microsoft documents two separate deadlocks here. Calling
            # WaitForExit before reading deadlocks once the child fills a pipe
            # buffer. Calling ReadToEnd on stdout and then ReadToEnd on stderr
            # deadlocks the same way if the child fills the stream that is not
            # being read yet. ReadToEndAsync on both avoids both cases.
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit($TimeoutMs)) {
              $p.Kill($true)
              throw "Ferry.exe $($FerryArgs -join ' ') did not exit within $TimeoutMs ms"
            }
            return @{ Out = $outTask.Result; Err = $errTask.Result; Code = $p.ExitCode }
          }

          $help = Invoke-Ferry @('--help')
          if ($help.Code -ne 0) {
            Write-Host "::error::--help exited $($help.Code)"
            Write-Host $help.Out; Write-Host $help.Err
            exit 1
          }
          if ($help.Out -notmatch 'Usage') {
            Write-Host "::error::--help printed no usage text"
            Write-Host "stdout: [$($help.Out)]"; Write-Host "stderr: [$($help.Err)]"
            exit 1
          }
          Write-Host "--help OK"

          $expected = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $ver = Invoke-Ferry @('--version')
          if ($ver.Code -ne 0 -or $ver.Out -notmatch [regex]::Escape($expected)) {
            Write-Host "::error::--version did not report $expected"
            Write-Host "stdout: [$($ver.Out)] exit: $($ver.Code)"
            exit 1
          }
          Write-Host "--version OK ($expected)"

          # --- TLS trust (issue #134) ---
          # Parses the exe's own report. It must NOT stat the path from pwsh: onefile
          # deletes sys._MEIPASS on exit, so any post-hoc Test-Path always fails.
          $tls = Invoke-Ferry @('tls-check')
          if ($tls.Code -ne 0) {
            Write-Host "::error::tls-check exited $($tls.Code)"
            Write-Host $tls.Out; Write-Host $tls.Err
            exit 1
          }
          if ($tls.Out -notmatch 'trust-source:\s*union') {
            Write-Host "::error::the frozen exe did not build the union trust store"
            Write-Host $tls.Out
            exit 1
          }
          Write-Host "tls-check OK: $($tls.Out -replace "`r?`n", ' | ')"

          # --- AttachConsole path (issue #123 symptom 3, no redirection) ---
          # This check must not use Invoke-Ferry. Invoke-Ferry redirects
          # stdout and stderr, which gives the process a real inherited
          # stdout handle. That handle satisfies step 1 of the console
          # ladder (_stdout_is_usable), so AttachConsole is never called and
          # the --help and --version checks above never exercise it.
          #
          # With no redirection, step 1 fails and acquire_console() must
          # call _attach_parent_console(). If AttachConsole succeeds, Click
          # runs and exits 0. If it fails, acquire_console() returns False,
          # should_run_cli() returns False, and gui.main() runs instead.
          # gui.main() does not exit. A bounded wait that returns exit code
          # 0 shows the attach path ran and worked. A timeout shows it did
          # not.
          #
          # Keep this check separate from Invoke-Ferry. Adding redirection
          # here would remove the only coverage of the attach path.
          $attachTimeoutMs = 30000
          $attachProc = Start-Process -FilePath $exe -ArgumentList '--help' -PassThru
          if (-not $attachProc.WaitForExit($attachTimeoutMs)) {
            taskkill /T /F /PID $attachProc.Id 2>&1 | Out-Null
            Write-Host "::error::Ferry.exe --help with no redirection did not exit within $attachTimeoutMs ms. AttachConsole may have failed and the GUI may have launched instead."
            exit 1
          }
          if ($attachProc.ExitCode -ne 0) {
            Write-Host "::error::Ferry.exe --help with no redirection exited $($attachProc.ExitCode)"
            exit 1
          }
          Write-Host "AttachConsole path OK: no redirection, exited 0"

      - name: Sign Windows binary
        if: env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        # shell: bash is required here -- windows-latest defaults to pwsh, where
        # `base64 -d` and `del` are not valid. This step has never run (the cert
        # secret is unset), so the breakage was latent: it would have failed the
        # first time signing was actually enabled.
        shell: bash
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 -d > cert.pfx
          signtool sign /fd SHA256 /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" dist/Ferry.exe
          rm -f cert.pfx

      - name: Rename artifact
        run: mv dist/Ferry.exe dist/Ferry-windows-x86_64.exe
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: ferry-windows
          path: dist/Ferry-windows-x86_64.exe
          retention-days: 1

  build-macos:
    name: Build macOS executable (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # Last x86_64 image GitHub offers; support ends August 2027, after
          # which Intel Macs need a universal2 cross-build or get dropped.
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra native --extra dev

      - name: Build executable
        run: uv run --extra dev pyinstaller ferry.spec

      # Developer ID signing + notarization land here. Until then PyInstaller's
      # ad-hoc signature is all the bundle carries, so Gatekeeper rejects it on
      # first launch and users must approve the app via System Settings. See
      # docs/getting-started/install.md. Notarization additionally requires
      # `--options runtime` plus an entitlements plist; signing alone does not
      # clear the warning, which is why no signing step runs here today.

      - name: Archive .app bundle
        # ditto, not zip: the onedir bundle is a symlink farm (~119 links). Info-ZIP
        # follows symlinks by default, which doubles the artifact (measured 91 MB vs
        # 45 MB) and breaks the code-signature seal on extraction. Name Ferry.app
        # explicitly -- COLLECT also emits dist/Ferry/, which must not ship.
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent Ferry.app ../Ferry-macos-${{ matrix.arch }}.zip

      - name: Verify the archived artifact
        # Assertions run on the EXTRACTED tree, mirroring what Archive Utility does on
        # a user's Mac. `codesign --verify` against dist/Ferry.app cannot see a
        # dereferenced archive, so symlink count and size are the real detectors.
        run: |
          set -euo pipefail
          mkdir -p _verify
          ditto -x -k "Ferry-macos-${{ matrix.arch }}.zip" _verify
          APP="_verify/Ferry.app"
          LINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          echo "symlinks in extracted bundle: $LINKS"
          if [ "$LINKS" -eq 0 ]; then
            echo "::error::archive lost its symlinks - the signature seal is broken"
            exit 1
          fi
          ON_DISK=$(du -sk dist/Ferry.app | cut -f1)
          EXTRACTED=$(du -sk "$APP" | cut -f1)
          echo "on-disk ${ON_DISK}K vs extracted ${EXTRACTED}K"
          python3 -c "import sys; sys.exit(0 if abs($ON_DISK-$EXTRACTED) <= 0.10*$ON_DISK else 1)" || {
            echo "::error::extracted size differs from the built bundle by more than 10%"
            exit 1
          }
          codesign --verify --deep --strict "$APP"
          # -print -quit rather than `| grep -q .`: under pipefail a SIGPIPE'd find
          # would surface as a bogus "missing" failure.
          test -n "$(find "$APP" -name dce_checksums.json -print -quit)" || {
            echo "::error::dce_checksums.json missing from the bundle"
            exit 1
          }
          test -n "$(find "$APP" -path '*discord_ferry/templates/*.json' -print -quit)" || {
            echo "::error::template JSON missing from the bundle"
            exit 1
          }

      - uses: actions/upload-artifact@v6
        with:
          name: ferry-macos-${{ matrix.arch }}
          path: Ferry-macos-${{ matrix.arch }}.zip
          retention-days: 1

  release:
    name: Create release and publish
    needs: [build-windows, build-macos]
    # Tag runs only. On a workflow_dispatch, github.ref is a branch ref and
    # softprops/action-gh-release hard-fails ("GitHub Releases requires a tag"), so
    # without this guard every manual run goes red at the publish step -- which looks
    # exactly like the packaging failure the dispatch exists to detect.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: ferry-windows
          path: release-assets/

      - name: Download macOS artifact (Apple Silicon)
        uses: actions/download-artifact@v7
        with:
          name: ferry-macos-arm64
          path: release-assets/

      - name: Download macOS artifact (Intel)
        uses: actions/download-artifact@v7
        with:
          name: ferry-macos-x86_64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/Ferry-windows-x86_64.exe
            release-assets/Ferry-macos-arm64.zip
            release-assets/Ferry-macos-x86_64.zip

      - name: Build Python distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
