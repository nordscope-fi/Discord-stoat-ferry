[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-ferry"
version = "2.19.4"
description = "Migrate Discord servers to Stoat (formerly Revolt)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Peter Sterkenburg" }]
keywords = ["discord", "stoat", "revolt", "migration", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiohttp>=3.14",  # encode_basic_auth landed in 3.14.0; core/http.py imports it
    "certifi>=2024.0",
    "click>=8.0",
    "ijson>=3.0",
    "multidict>=4.5",
    "nicegui>=2.0",
    "python-dotenv",
    "rich>=13.0",
    "yarl>=1.17",
]

[project.scripts]
ferry = "discord_ferry.cli:main"
ferry-gui = "discord_ferry.gui:main"

[project.gui-scripts]
ferry-desktop = "discord_ferry.gui:main"

[project.urls]
Homepage = "https://github.com/nordscope-fi/Discord-stoat-ferry"
Issues = "https://github.com/nordscope-fi/Discord-stoat-ferry/issues"

[project.optional-dependencies]
native = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aioresponses>=0.7",
    "ruff",
    "mypy",
    "pyinstaller>=6.0",
]
# Mutation testing, kept out of `dev` on purpose: CI installs `dev` on five jobs
# and never runs a mutation sweep, so putting cosmic-ray there would pay its
# install cost on every push for a tool only used locally and on demand.
#   uv sync --extra mutation && bash scripts/mutate.sh
mutation = [
    "cosmic-ray>=8.3",
]
docs = [
    "mkdocs-material>=9.0",
]

# Import firewall: explicitly package only src/discord_ferry into wheels.
# tests/provisioning/ contains bot-auth write paths that must NEVER ship as
# part of the installable package. See docs/plans/designs/2026-05-16-issue-35-*.md.
[tool.hatch.build.targets.wheel]
packages = ["src/discord_ferry"]

[tool.hatch.build.targets.sdist]
# release.yml downloads the built binaries into release-assets/ and only then
# runs `uv build`, so an unconfigured sdist swept them in: every published sdist
# was ~91.5 MB against a 0.2 MB wheel. Adding the third (Intel) artifact in
# v2.8.0 pushed it past PyPI's 100 MB project limit and the upload started
# failing. The wheel was never affected — it is scoped to src/ above.
exclude = ["release-assets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["discord_ferry"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
