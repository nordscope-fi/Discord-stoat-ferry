[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-ferry"
version = "2.6.5"
description = "Migrate Discord servers to Stoat (formerly Revolt)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Peter Sterkenburg" }]
keywords = ["discord", "stoat", "revolt", "migration", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
    "ijson>=3.0",
    "nicegui>=2.0",
    "python-dotenv",
    "rich>=13.0",
]

[project.scripts]
ferry = "discord_ferry.cli:main"
ferry-gui = "discord_ferry.gui:main"

[project.gui-scripts]
ferry-desktop = "discord_ferry.gui:main"

[project.urls]
Homepage = "https://github.com/nordscope-fi/Discord-stoat-ferry"
Issues = "https://github.com/nordscope-fi/Discord-stoat-ferry/issues"

[project.optional-dependencies]
native = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aioresponses>=0.7",
    "ruff",
    "mypy",
    "pyinstaller>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
]

# Import firewall: explicitly package only src/discord_ferry into wheels.
# tests/provisioning/ contains bot-auth write paths that must NEVER ship as
# part of the installable package. See docs/plans/designs/2026-05-16-issue-35-*.md.
[tool.hatch.build.targets.wheel]
packages = ["src/discord_ferry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["discord_ferry"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
