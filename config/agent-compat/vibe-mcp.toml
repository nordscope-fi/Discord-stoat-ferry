# Discord Ferry — Vibe CLI project configuration.
# Generated by scripts/agent-compat/install-local.mjs from this template into
# .vibe/config.toml (Vibe reads project MCP servers from config.toml, not a
# separate mcp.toml). Do not edit the generated file directly; edit this file
# and re-run the installer.

# Bash allowlist: auto-approve commands this project needs (mirrors Qwen's
# permission list). Vibe's allowlist matches command names, not globs.
[tools.bash]
allowlist = ["git", "uv", "gh", "node", "python3", "python", "qmd", "serena", "jq", "ls", "find", "wc", "ln", "npx", "plain-english", "sed", "cat", "head", "tail", "diff", "mkdir", "cp"]

[[mcp_servers]]
name = "serena"
transport = "stdio"
command = "serena"
args = ["start-mcp-server", "--context", "vibe", "--project-from-cwd"]

[[mcp_servers]]
name = "qmd"
transport = "stdio"
command = "qmd"
args = ["mcp"]

[[mcp_servers]]
name = "context7"
transport = "stdio"
command = "node"
args = ["__DATA_HOME__/discord-ferry/reviewer-runtime/current/context7-mcp.mjs"]

# No second-opinion for Vibe. Vibe runs on Mistral, so asking Mistral
# for a second opinion from within Mistral is circular.
# No active_model pin here: the user's ~/.vibe/config.toml owns the model
# choice (AGENTS.md Cognitive Tiering). The review adapter (vibe-review.mjs)
# pins its own model in an isolated VIBE_HOME.
