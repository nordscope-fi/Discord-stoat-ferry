# Discord Ferry — Vibe CLI MCP server configuration.
# Generated by scripts/agent-compat/install-local.mjs from this template into
# .vibe/config.toml (Vibe reads project MCP servers from config.toml, not a
# separate mcp.toml). Do not edit the generated file directly; edit this file
# and re-run the installer.

[[mcp_servers]]
name = "serena"
transport = "stdio"
command = "serena"
args = ["start-mcp-server", "--context", "vibe", "--project-from-cwd"]

[[mcp_servers]]
name = "qmd"
transport = "stdio"
command = "qmd"
args = ["mcp"]

[[mcp_servers]]
name = "context7"
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# No second-opinion for Vibe. Vibe runs on Mistral, so asking Mistral
# for a second opinion from within Mistral is circular.
