# Discord Ferry — Codex CLI project configuration.
# Generated by scripts/agent-compat/install-local.mjs from this template.
# Do not edit the generated .codex/config.toml directly; edit this file and re-run the installer.

# These consequential defaults are governed by ADR-027.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "disabled"

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[mcp_servers.qmd]
command = "qmd"
args = ["mcp"]
startup_timeout_sec = 20

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context", "codex", "--project-from-cwd"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.context7]
command = "node"
args = ["__DATA_HOME__/discord-ferry/reviewer-runtime/current/context7-mcp.mjs"]
startup_timeout_sec = 30
