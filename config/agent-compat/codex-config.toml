# Discord Ferry — Codex CLI project configuration.
# Generated by scripts/agent-compat/install-local.mjs from this template.
# Do not edit the generated .codex/config.toml directly; edit this file and re-run the installer.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "disabled"

[features]
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[mcp_servers.qmd]
command = "qmd"
args = ["mcp"]
startup_timeout_sec = 20

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context", "codex", "--project-from-cwd"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 30

# second-opinion: disabled until the launch command is verified.
# The Claude Code config reads it from .mcp.json, which is credential-guarded.
# To enable: set enabled = true and verify the command/args match the installed server.
[mcp_servers.second-opinion]
enabled = false
command = "npx"
args = ["-y", "second-opinion-mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 180
